<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1B5E20">
<title>Nutsa · Confirmation</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ================== LOGIN ================== -->
<section id="login-screen" class="screen active">
  <div class="login-hero">
    <div class="brand">
      <div class="brand-logo">🌰</div>
      <h1>Nutsa</h1>
      <p class="brand-sub">Système de confirmation</p>
    </div>

    <div class="login-card">
      <h2>Connexion agent</h2>

      <label class="field">
        <span>Numéro d'agent</span>
        <div class="worker-picker">
          <button type="button" class="worker-btn" data-worker="1">1</button>
          <button type="button" class="worker-btn" data-worker="2">2</button>
          <button type="button" class="worker-btn" data-worker="3">3</button>
        </div>
      </label>

      <label class="field">
        <span>Code PIN</span>
        <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="off">
      </label>

      <button id="login-btn" class="btn btn-primary btn-lg" disabled>
        <span>Se connecter</span>
      </button>

      <p id="login-error" class="error-msg"></p>
    </div>

    <p class="footer-note">v1.0 · Nutsa Distribution Algérie</p>
  </div>
</section>

<!-- ================== DASHBOARD ================== -->
<section id="dashboard-screen" class="screen">
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="agent-badge" id="agent-badge">A1</div>
        <div>
          <p class="header-title">Bonjour, Agent <span id="agent-num">1</span></p>
          <p class="header-sub" id="header-date"></p>
        </div>
      </div>
      <button id="logout-btn" class="icon-btn" title="Déconnexion">⏻</button>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-num" id="stat-pending">0</div>
        <div class="stat-label">En attente</div>
      </div>
      <div class="stat stat-green">
        <div class="stat-num" id="stat-confirmed">0</div>
        <div class="stat-label">Confirmées</div>
      </div>
      <div class="stat stat-red">
        <div class="stat-num" id="stat-cancelled">0</div>
        <div class="stat-label">Annulées</div>
      </div>
    </div>
  </header>

  <div class="filter-bar">
    <button class="chip chip-active" data-filter="all">Toutes</button>
    <button class="chip" data-filter="Pending">En attente</button>
    <button class="chip" data-filter="Callback">Rappeler</button>
    <button class="chip" data-filter="No Answer">Sans réponse</button>
    <button class="chip" data-filter="Confirmed">Confirmées</button>
  </div>

  <div class="search-bar">
    <input type="search" id="search-input" placeholder="🔍 Rechercher (nom, téléphone, N°)">
  </div>

  <main id="orders-list" class="orders-list">
    <div class="loading">Chargement…</div>
  </main>

  <button id="refresh-btn" class="fab" title="Actualiser">↻</button>
</section>

<!-- ================== ORDER DETAIL SHEET ================== -->
<section id="order-sheet" class="sheet-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <button class="sheet-close" id="sheet-close">✕</button>

    <div class="sheet-body" id="sheet-body">
      <!-- filled dynamically -->
    </div>
  </div>
</section>

<!-- ================== TOAST ================== -->
<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
